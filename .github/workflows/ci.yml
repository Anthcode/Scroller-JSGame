name: Testy E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalacja zaleznosci
        run: npm ci

      - name: Instalacja przegladarki (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Uruchomienie testow
        run: npm test

      - name: Raport Playwright (na wypadek awarii)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
