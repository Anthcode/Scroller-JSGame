<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Parallax FX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05070f; font-family: 'Rajdhani', Arial, sans-serif; }
  .stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { position: relative; height: min(100vh, 177.8vw); aspect-ratio: 853 / 1844; max-width: 100vw; }
  #gameFrame { position: absolute; left: 12.9%; top: 25.8%; width: 74.3%; height: 40.3%; border: none; z-index: 1; pointer-events: none; }
  /* Okno gry (#gameFrame) na mobile jest ograniczone do przezroczystego wycięcia w grafice
     ramki (~74%x40% karty) - w praktyce małe okno grania na telefonie. W trakcie REALNEJ
     rozgrywki (nie w menu/demo) porzucamy więc ramkę i rozciągamy #gameFrame na cały viewport
     (position:fixed, sibling ~ chowa resztę dekoracji karty) - dokładnie jak przed dodaniem
     strony startowej. Na desktopie (patrz media query niżej) ta zmiana jest wyłączona, bo tam
     wycięcie w ramce jest już wystarczająco duże (~62%x57%), a spójność z ekranem menu ma
     większą wartość niż dodatkowe piksele. */
  #gameFrame.playing {
    pointer-events: auto;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 3;
  }
  #gameFrame.playing ~ .frame-art,
  #gameFrame.playing ~ #settingsBtn {
    display: none;
  }
  #gameFrame.playing ~ #backBtn {
    position: fixed;
    top: 16px;
    left: 16px;
  }
  .frame-art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; image-rendering: pixelated; }

  /* Realny licznik żyć (serca) w miejscu, gdzie w grafice ramki (frame-art) kiedyś było
     wypalone na sztywno 6 serc - te piksele zostały wymazane z obu PNG-ów (images/parallax-
     frame-cutout*.png), a w ich miejsce wchodzi ta nakładka z 3 sercami (tyle ile realnie ma
     gracz, patrz player.maxHp w player.js) zbudowana z images/artefacts/life-hearts.png i
     zasilana prawdziwym stanem gry przez getLives() (patrz script niżej). Współrzędne %
     odpowiadają dokładnie wymazanemu obszarowi na obrazku mobile (853x1844) - nadpisywane
     w media query desktopowej dla parallax-frame-cutout-desktop.png (1672x941). */
  .lives-hud { position: absolute; left: 58.38%; top: 87.20%; width: 34.82%; height: 10.85%; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 4%; pointer-events: none; }
  .lives-hud .heart-slot { height: 68%; aspect-ratio: 84 / 72; background-image: url('images/artefacts/life-hearts.png'); background-size: 300% 100%; background-position: 0 0; background-repeat: no-repeat; image-rendering: pixelated; transition: filter 0.15s ease, opacity 0.15s ease; }
  .lives-hud .heart-slot.lost { filter: grayscale(1) brightness(0.45); opacity: 0.45; }
  #playHit { position: absolute; left: 11.9%; top: 77.5%; width: 75.9%; height: 9%; z-index: 3; cursor: pointer; animation: ctaPulse 2.2s ease-in-out infinite; }
  #playHit:hover { animation: none; filter: brightness(1.15); }
  #playHit.hidden { display: none; }
  #backBtn { position: absolute; top: 2%; left: 5%; z-index: 4; font-size: 11px; color: #00ffff; cursor: pointer; background: rgba(10,16,34,0.6); border: 1px solid rgba(0,255,255,0.35); backdrop-filter: blur(6px); padding: 8px 14px; border-radius: 4px; font-family: 'Press Start 2P', monospace; letter-spacing: 0.02em; display: none; }
  #backBtn:hover { background: rgba(0,255,255,0.15); }
  #backBtn.visible { display: block; }
  #settingsBtn { position: absolute; top: 1.5%; right: 4%; width: 8%; aspect-ratio: 1; border-radius: 50%; background: rgba(0,20,20,0.55); border: 2px solid #00ffff; box-shadow: 0 0 10px rgba(0,255,255,0.6); z-index: 4; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #settingsBtn:hover { background: rgba(0,255,255,0.18); transform: rotate(35deg); }
  #settingsBtn div { width: 36%; aspect-ratio: 1; border-radius: 50%; border: 2px solid #00ffff; }
  @keyframes ctaPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* Ekrany desktopowe (szerokie/poziome) dostają osobną, poziomą grafikę ramki
     (images/parallax-frame-cutout-desktop.png, 1672x941) zamiast rozciągania pionowej
     grafiki telefonowej - .card zmienia proporcje, a #gameFrame/#playHit dostają nowe
     procenty wykryte piksel-po-pikselu na tym obrazku (ten sam sposób co dla wersji
     mobile - patrz README/handoff). Ikona ustawień jest już wypalona w tej grafice
     (w przeciwieństwie do mobile), więc CSS-owy #settingsBtn się tu chowa.
     content: url(...) na <img> podmienia renderowany plik bez ruszania atrybutu src -
     wspierane we wszystkich głównych przeglądarkach. */
  @media (min-width: 1024px) and (orientation: landscape) {
    .card {
      height: auto;
      max-width: none;
      width: min(100vw, 177.68vh);
      aspect-ratio: 1672 / 941;
      max-height: 100vh;
    }
    .frame-art {
      content: url('images/parallax-frame-cutout-desktop.png');
    }
    #gameFrame {
      left: 18.9%;
      top: 21.25%;
      width: 62.26%;
      height: 56.96%;
    }
    #playHit {
      left: 36.36%;
      top: 86.08%;
      width: 27.27%;
      height: 9.56%;
    }
    #settingsBtn {
      display: none;
    }
    .lives-hud {
    left: 77.85%;
    top: 83.3%;
    width: 15.37%;
    height: 10.62%;
    }
    /* Fullscreen-w-trakcie-gry (wyżej) jest zamierzony wyłącznie dla mobile - tu wycięcie w
       ramce jest już wystarczająco duże, a zeskakiwanie do pełnego ekranu psułoby spójność
       z ekranem menu bez realnej korzyści. Te same selektory, wyżej w kaskadzie (media query
       ładuje się później w pliku), więc wygrywają przy równej specyficzności. */
    #gameFrame.playing {
      position: absolute;
      inset: auto;
      left: 18.9%;
      top: 21.25%;
      width: 62.26%;
      height: 56.96%;
      z-index: 1;
    }
    #gameFrame.playing ~ .frame-art {
      display: block;
    }
    #gameFrame.playing ~ #backBtn {
      position: absolute;
      top: 2%;
      left: 5%;
    }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <iframe id="gameFrame" src="game-demo.html" title="Podgląd gry" allow="fullscreen"></iframe>
    <img class="frame-art" src="images/parallax-frame-cutout.png" alt="">
    <div id="livesHud" class="lives-hud">
      <div class="heart-slot"></div>
      <div class="heart-slot"></div>
      <div class="heart-slot"></div>
    </div>
    <div id="playHit"></div>
    <div id="backBtn">← MENU</div>
    <div id="settingsBtn"><div></div></div>
  </div>
</div>
<script>
  const gameFrame = document.getElementById('gameFrame');
  const playHit = document.getElementById('playHit');
  const backBtn = document.getElementById('backBtn');
  const heartSlots = document.querySelectorAll('#livesHud .heart-slot');

  // Odpytuje getLives() (game.js, wewnątrz iframe'a) co klatkę i przemalowuje serca na
  // ramce startowej - działa zarówno w demie na ekranie menu, jak i w trakcie realnej gry
  // (na desktopie ramka zostaje widoczna podczas gry, patrz #gameFrame.playing ~ .frame-art
  // wyżej). Bezpośredni odczyt gameFrame.contentWindow zamiast postMessage: to ten sam
  // origin (statyczne pliki lokalne), więc synchroniczny dostęp działa od razu.
  function updateLivesHud() {
    try {
      const lives = gameFrame.contentWindow.getLives && gameFrame.contentWindow.getLives();
      if (lives) {
        heartSlots.forEach((el, i) => el.classList.toggle('lost', i >= lives.hp));
      }
    } catch (e) {}
    requestAnimationFrame(updateLivesHud);
  }
  updateLivesHud();

  // Ten sam breakpoint co CSS "@media (min-width: 1024px) and (orientation: landscape)"
  // wyżej (desktop = ramka zostaje taka sama w trakcie gry, #gameFrame.playing nic nie
  // zmienia) - sprawdzany tu jawnie w JS na PRAWDZIWYM viewporcie strony, bo iframe wewnątrz
  // #gameFrame jest małym oknem nawet na szerokim desktopie i jego własna media query nigdy
  // nie zobaczyłaby >=1024px.
  const isDesktopFramed = () => window.matchMedia('(min-width: 1024px) and (orientation: landscape)').matches;

  playHit.addEventListener('click', () => {
    gameFrame.classList.add('playing');
    playHit.classList.add('hidden');
    backBtn.classList.add('visible');
    setTimeout(() => {
      try { gameFrame.contentWindow.startGame && gameFrame.contentWindow.startGame(); } catch (e) {}
      // Sterowanie (ruch/skok) w player.js nasłuchuje keydown na document silnika,
      // czyli dokumencie WEWNĄTRZ iframe'a - klik w #playHit odbył się w dokumencie
      // nadrzędnym, więc bez jawnego focus() klawiatura zostaje "przypięta" do strony
      // startowej i żaden klawisz nigdy nie dociera do gry (gracz stoi w miejscu).
      gameFrame.focus();
      // Sygnał do CSS wewnątrz iframe'a (html.fullscreen w game-demo.html), żeby canvas
      // wrócił do pełnego "contain" na czas prawdziwej gry - w małym oknie menu skaluje się
      // "po szerokości" i przycina nadmiar wysokości, co przy #gameFrame.playing rozciągniętym
      // na cały viewport (mobile, patrz CSS wyżej) zostawiłoby tylko wąski pasek gry.
      // isDesktopFramed (ten sam breakpoint co #gameFrame.playing w desktopowej media query
      // wyżej) MUSI być sprawdzony tutaj, względem PRAWDZIWEGO viewportu przeglądarki -
      // #gameFrame to małe okno nawet na szerokim desktopie, więc odpowiadająca media query
      // WEWNĄTRZ iframe'a (game-demo.html) nigdy by nie zobaczyła szerokości >=1024px i nie
      // dałoby się tam odróżnić trybów bez zdublowania tej decyzji na podstawie złego viewportu.
      if (!isDesktopFramed()) {
        try { gameFrame.contentDocument.documentElement.classList.add('fullscreen'); } catch (e) {}
        // Natywny Fullscreen API na #gameFrame (element w TYM dokumencie, nie wewnątrz
        // iframe'a) - chowa pasek adresu przeglądarki na urządzeniach, które to wspierają
        // (Android Chrome). Wywołanie musi nastąpić w tym samym geście użytkownika co klik
        // #playHit, inaczej przeglądarka je odrzuci. Na iPhone Safari requestFullscreen()
        // dla zwykłych elementów zwykle istnieje, ale odrzuca Promise - .catch() to łyka,
        // więc gra po cichu zostaje przy powyższym CSS-owym "fill viewport", które już działa
        // wszędzie. `?.()` na wypadek przeglądarek bez tej metody w ogóle.
        gameFrame.requestFullscreen?.().catch(() => {});
      }
    }, 50);
  });

  backBtn.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    gameFrame.classList.remove('playing');
    playHit.classList.remove('hidden');
    backBtn.classList.remove('visible');
    gameFrame.src = 'game-demo.html';
  });
</script>
</body>
</html>
