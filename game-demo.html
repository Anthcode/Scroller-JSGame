<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Parallax FX - silnik</title>
<style>
  * { margin: 0; padding: 0; }
  /* Tło przezroczyste: gdy ta strona jest osadzona w #gameFrame na stronie startowej
     (index.html), "dziura" wycięta w grafice ramki (parallax-frame-cutout.png) ma
     odsłaniać wprost scenę gry, bez żadnego koloru pod spodem. */
  html, body { height: 100%; overscroll-behavior: none; background: transparent; overflow: hidden; }
  body { position: fixed; inset: 0; font-family: Arial, sans-serif; }
  canvas {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    /* Domyślnie (samodzielne otwarcie tej strony - podgląd developerski, testy e2e)
       dopasuj CAŁY canvas do viewportu bez przycinania ("contain") - poza kontekstem
       ekranu startowego liczy się widoczność całej sceny, nawet kosztem pustych pasów
       przy niepasujących proporcjach. */
    width: auto;
    height: auto;
    max-width: 100vw;
    max-height: 100vh;
    /* Zapobiega przewijaniu/odświeżaniu strony gestem podczas przeciągania palcem po
       canvasie - inaczej przeglądarka próbuje scrollować stronę. */
    touch-action: none;
  }
  /* Osadzone w oknie ekranu startowego (index.html, przez #gameFrame) - zarówno w trybie
     menu/demo, JAK I w trakcie prawdziwej rozgrywki (patrz zmiana: gra zostaje w wyciętym
     oknie ramki zamiast przechodzić na pełny ekran). Wycięcie w grafice ramki ma inne
     proporcje niż canvas (800x600, patrz core.js), więc "contain" zostawiał puste pasy po
     bokach zamiast wypełniać całą dziurę - skalujemy więc po szerokości ("cover"); nadmiar
     wysokości chowa się pod nieprzezroczystą grafiką ramki poza wycięciem, dokładnie tak
     samo dla demo i dla realnej gry, żeby przejście między nimi nie skakało rozmiarem. */
  html.embedded canvas {
    width: 100%;
    height: auto;
    max-width: none;
    max-height: none;
  }

  /* Panel debugowy (pogoda/statystyki/klawisze) jest przydatny przy bezpośrednim
     otwarciu tej strony (podgląd developerski, testy e2e), ale gdy strona jest
     osadzona w #gameFrame na stronie startowej zasłaniałby scenę widoczną przez
     wycięcie w grafice ramki - stąd chowamy go tam całkowicie. */
  html.embedded .ui-toggle-btn,
  html.embedded .keyboard-info {
    display: none;
  }

  .weather-controls {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(0, 0, 0, 0.85);
    padding: 20px;
    border-radius: 15px;
    color: white;
    font-family: Arial, sans-serif;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    border: 2px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    z-index: 1000;
  }

  .weather-controls h3 {
    margin: 0 0 15px 0;
    color: #00ffff;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
  }

  .weather-btn {
    margin: 5px;
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }

  .weather-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  }

  .rain-btn {
    background: linear-gradient(45deg, #4A90E2, #357ABD);
    color: white;
  }

  .snow-btn {
    background: linear-gradient(45deg, #E8F4F8, #B8D4DA);
    color: #333;
  }

  .leaves-btn {
    background: linear-gradient(45deg, #D2691E, #A0522D);
    color: white;
  }

  .sun-btn {
    background: linear-gradient(45deg, #87CEEB, #4682B4);
    color: white;
  }

  .control-group {
    margin: 15px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .control-group label {
    color: #ccc;
    font-size: 14px;
    margin-right: 10px;
    min-width: 100px;
  }

  .control-group input[type="range"] {
    flex: 1;
    margin: 0 10px;
    accent-color: #00ffff;
  }

  .value-display {
    color: #00ffff;
    font-weight: bold;
    min-width: 40px;
    text-align: right;
  }

  .stats-panel {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.85);
    padding: 15px;
    border-radius: 10px;
    color: #00ffff;
    font-family: Arial, sans-serif;
    border: 2px solid rgba(0, 255, 255, 0.3);
    backdrop-filter: blur(10px);
  }

  .stats-panel h4 {
    margin: 0 0 10px 0;
    color: #fff;
  }

  .stat-item {
    margin: 5px 0;
    font-size: 14px;
  }

  .keyboard-info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(0, 0, 0, 0.7);
    padding: 10px;
    border-radius: 8px;
    color: #ccc;
    font-size: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  /* Panele pogody/statystyk są domyślnie ukryte - pokazuje je przycisk toggle */
  .ui-panel.hidden {
    display: none;
  }

  .ui-toggle-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid rgba(255, 255, 255, 0.15);
    color: #00ffff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    z-index: 1002;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s ease;
  }

  .ui-toggle-btn:hover {
    transform: scale(1.1);
  }

  @media (hover: none) and (pointer: coarse) {
    /* Podpowiedź klawiszy jest bezużyteczna na urządzeniu dotykowym -
       sterowanie to przytrzymaj-i-przeciągnij na samym canvasie. */
    .keyboard-info {
      display: none;
    }
  }
</style>
</head>
<body>
<canvas id="canvas1"></canvas>

<!-- Przycisk pokazujący/ukrywający panele pogody i statystyk -->
<button class="ui-toggle-btn" id="uiToggleBtn" onclick="toggleUiPanels()" title="Pokaż/ukryj panele pogody i statystyk">⚙️</button>

<!-- Panel kontrolek pogody -->
<div class="weather-controls ui-panel hidden">
  <h3>🌦️ Kontrola Pogody</h3>

  <div>
    <button class="weather-btn rain-btn" onclick="changeWeather('rain')">
      🌧️ Deszcz
    </button>
    <button class="weather-btn snow-btn" onclick="changeWeather('snow')">
      ❄️ Śnieg
    </button>
    <button class="weather-btn leaves-btn" onclick="changeWeather('leaves')">
      🍃 Liście
    </button>
    <button class="weather-btn sun-btn" onclick="changeWeather('none')">
      ☀️ Słońce
    </button>
  </div>

  <div class="control-group">
    <label>Intensywność:</label>
    <input type="range" id="particleSlider" min="0" max="150" value="80"
           onchange="setParticleCount(this.value); updateSliderValue('particles', this.value)">
    <span class="value-display" id="particlesValue">80</span>
  </div>

  <div class="control-group">
    <label>Siła wiatru:</label>
    <input type="range" id="windSlider" min="0" max="3" step="0.1" value="1"
           onchange="windForce = parseFloat(this.value); updateSliderValue('wind', this.value)">
    <span class="value-display" id="windValue">1.0</span>
  </div>

  <div class="control-group">
    <label>Prędkość gry:</label>
    <input type="range" id="speedSlider" min="0.5" max="5" step="0.1" value="1"
           onchange="gamespeed = parseFloat(this.value); updateSliderValue('speed', this.value)">
    <span class="value-display" id="speedValue">1.0</span>
  </div>

  <div class="control-group">
    <label>Szybkość dnia:</label>
    <input type="range" id="daySpeedSlider" min="0" max="5" step="0.1" value="1"
           onchange="daySpeed = parseFloat(this.value) / (60 * 60); updateSliderValue('dayspeed', this.value)">
    <span class="value-display" id="dayspeedValue">1.0</span>
  </div>
</div>

<!-- Panel statystyk -->
<div class="stats-panel ui-panel hidden">
  <h4>📊 Statystyki</h4>
  <div class="stat-item">Cząsteczki: <span id="particleCount">0</span></div>
  <div class="stat-item">Pogoda: <span id="currentWeather">Słońce</span></div>
  <div class="stat-item">FPS: <span id="fpsCounter">60</span></div>
  <div class="stat-item">Pora dnia: <span id="timeOfDay">Noc 🌙</span></div>
</div>

<!-- Informacje o klawiszach -->
<div class="keyboard-info">
  <strong>⌨️ Klawisze:</strong> 1-Deszcz, 2-Śnieg, 3-Liście, 0-Słońce, T-Pauza cyklu
</div>

<!-- Kolejność ma znaczenie: core.js (canvas/stałe) najpierw, potem animator i klasy
     encji, game.js (stan/wynik/HUD) przed bootstrapem, który je wszystkie spina. -->
<script src="core.js"></script>
<script src="animatorController.js"></script>
<script src="world.js"></script>
<script src="player.js"></script>
<script src="enemy.js"></script>
<script src="game.js"></script>
<script src="script.js"></script>

<script>
  // Ta strona żyje albo samodzielnie (podgląd developerski, testy e2e), albo osadzona
  // w #gameFrame na stronie startowej (index.html) - w tym drugim przypadku chowamy
  // panel debugowy (patrz reguły CSS html.embedded wyżej).
  if (window.self !== window.top) {
    document.documentElement.classList.add('embedded');
  }

  // Niewidoczny joystick: dotknięcie i przytrzymanie gdziekolwiek na canvasie,
  // a kierunek przeciągnięcia palca od punktu startowego ustawia player.keys -
  // ten sam obiekt, którego używa obsługa klawiatury w player.js.
  (function setupTouchJoystick() {
    const canvas = document.getElementById('canvas1');
    const DEADZONE = 12; // px - minimalny dystans przeciągnięcia, żeby zarejestrować kierunek

    let startX = null;
    let startY = null;

    function resetKeys() {
      if (typeof player === 'undefined') return;
      player.keys.left = false;
      player.keys.right = false;
    }

    // Gracz porusza się tylko lewo/prawo - przeciągnięcie w górę wywołuje
    // skok (jump() sam pilnuje, żeby nie skakać powtórnie w powietrzu)
    function updateKeysFromDelta(dx, dy) {
      if (typeof player === 'undefined') return;
      player.keys.right = dx > DEADZONE;
      player.keys.left = dx < -DEADZONE;
      if (dy < -DEADZONE) player.jump();
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();

      // Poza stanem 'playing' dotknięcie ekranu startuje/restartuje grę
      // (ten sam efekt co Spacja - patrz game.js) zamiast zaczynać przeciągnięcie.
      if (typeof gameState !== 'undefined' && gameState !== 'playing') {
        startGame();
        return;
      }

      const t = e.changedTouches[0];
      startX = t.clientX;
      startY = t.clientY;
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (startX === null) return;
      e.preventDefault();
      const t = e.changedTouches[0];
      updateKeysFromDelta(t.clientX - startX, t.clientY - startY);
    }, { passive: false });

    const endTouch = (e) => {
      if (startX === null) return;
      e.preventDefault();
      startX = null;
      startY = null;
      resetKeys();
    };
    canvas.addEventListener('touchend', endTouch);
    canvas.addEventListener('touchcancel', endTouch);
  })();

  // Pokazuje/ukrywa panele pogody i statystyk (domyślnie schowane pod przyciskiem ⚙️)
  function toggleUiPanels() {
    document.querySelectorAll('.ui-panel').forEach(panel => {
      panel.classList.toggle('hidden');
    });
  }

  // Funkcje pomocnicze dla kontrolek
  function updateSliderValue(type, value) {
    const displays = {
      'particles': 'particlesValue',
      'wind': 'windValue',
      'speed': 'speedValue',
      'dayspeed': 'dayspeedValue'
    };

    if (displays[type]) {
      document.getElementById(displays[type]).textContent =
        type === 'particles' ? value : parseFloat(value).toFixed(1);
    }
  }

  // Aktualizacja statystyk
  function updateStats() {
    const weatherNames = {
      'rain': 'Deszcz 🌧️',
      'snow': 'Śnieg ❄️',
      'leaves': 'Liście 🍃',
      'none': 'Słońce ☀️'
    };

    if (typeof particles !== 'undefined') {
      document.getElementById('particleCount').textContent = particles.length;
    }

    if (typeof weatherMode !== 'undefined') {
      document.getElementById('currentWeather').textContent = weatherNames[weatherMode] || 'Nieznana';
    }

    if (typeof dayTime !== 'undefined') {
      const phases = [
        [0.0, 0.15, 'Noc 🌙'], [0.15, 0.30, 'Świt 🌅'],
        [0.30, 0.70, 'Dzień ☀️'], [0.70, 0.85, 'Zmierzch 🌇'],
        [0.85, 1.0,  'Noc 🌙']
      ];
      const phase = phases.find(p => dayTime >= p[0] && dayTime < p[1]);
      document.getElementById('timeOfDay').textContent = phase ? phase[2] : 'Noc 🌙';
    }
  }

  // Aktualizuj statystyki co sekundę
  setInterval(updateStats, 1000);

  // Prosta animacja FPS counter
  let fpsCounter = 0;
  let lastFpsTime = Date.now();

  function updateFPS() {
    fpsCounter++;
    const now = Date.now();
    if (now - lastFpsTime >= 1000) {
      document.getElementById('fpsCounter').textContent = fpsCounter;
      fpsCounter = 0;
      lastFpsTime = now;
    }
    requestAnimationFrame(updateFPS);
  }
  updateFPS();

  // Powiadomienie o załadowaniu (inicjalizacja systemu cząsteczek to już robi script.js)
  window.addEventListener('load', () => {
    setTimeout(() => {
      console.log("🎮 Enhanced Parallax załadowany!");
      console.log("🌦️ Kliknij przyciski pogody lub użyj klawiszy 1,2,3,0");
    }, 1500);
  });
</script>
</body>
</html>
